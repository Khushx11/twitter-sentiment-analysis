name: Checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: post-sentiment train examples/labelled_posts.csv --output /tmp/sentiment-run
      - run: post-sentiment predict /tmp/sentiment-run/model.joblib 'The support team was helpful'
      - run: python -m pip install playwright==1.56.0
      - run: python tests/browser_smoke.py /tmp/sentiment-run/model.joblib
